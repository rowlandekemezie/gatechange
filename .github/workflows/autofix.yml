name: Autofix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build lint plugin inputs
        run: pnpm turbo run build --filter=@rat-stack/capability

      - name: Apply formatter and safe lint fixes
        run: pnpm fix || true

      - name: Post the fixes as a patch on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git diff > fixes.patch
          if [ ! -s fixes.patch ]; then
            echo "Nothing to fix"
            exit 0
          fi
          {
            echo "### Autofix patch for ${GITHUB_SHA::7}"
            echo
            echo "Apply with \`git apply\`."
            echo
            echo '```diff'
            head -c 60000 fixes.patch
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md > /dev/null
          echo "Patch size: $(wc -c < fixes.patch) bytes"
