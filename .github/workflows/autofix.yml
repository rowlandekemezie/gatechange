name: Autofix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build lint plugin inputs
        run: pnpm turbo run build --filter=@rat-stack/capability

      - name: Apply formatter and safe lint fixes
        run: pnpm fix || true

      - name: Post the fixes as a patch on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git diff > fixes.patch
          if [ ! -s fixes.patch ]; then
            echo "Nothing to fix"
            exit 0
          fi
          gzip -9 -c fixes.patch | base64 -w0 > fixes.b64
          split -b 60000 -d -a 3 fixes.b64 part-
          total=$(ls part-* | wc -l)
          index=0
          for part in part-*; do
            index=$((index + 1))
            {
              echo "autofix-patch ${index}/${total}"
              cat "$part"
            } > comment.txt
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.txt > /dev/null
          done
          echo "Posted ${total} parts for $(wc -c < fixes.patch) bytes"
