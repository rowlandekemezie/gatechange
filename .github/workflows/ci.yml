name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      preview_plan_only:
        description: Plan the selected branch against persistent preview without deploying
        type: boolean
        default: false
      preview_parent_only:
        description: Limit the preview plan/deploy to the shared PR backend parent
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check, test, build
        shell: bash
        run: |
          set -o pipefail
          pnpm turbo run check test build --concurrency=1 --continue --output-logs=errors-only 2>&1 | tee ci.log

      - name: Keep the log for the failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci.log
          if-no-files-found: ignore
          retention-days: 1

  report-failure:
    name: Report failures on the commit
    needs: check
    if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ci-log

      - name: Comment on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          touch ci.log
          {
            echo "### CI failed on ${GITHUB_SHA::7}"
            echo
            echo '```text'
            grep -E "error|Error|ERR|✗|×|FAIL|failed|warning" ci.log | grep -v "^\s*$" | head -c 60000 || true
            echo '```'
          } > report.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@report.md > /dev/null

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jobs.rowlandekemezie.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build

      - name: Require CLOUDFLARE_API_TOKEN
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Set CLOUDFLARE_API_TOKEN on the production environment. docs/operations.md lists the steps."; exit 1; fi

      - name: Check Cloudflare credentials
        working-directory: apps/infra
        run: pnpm exec alchemy provider check-env --provider Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        working-directory: apps/infra
        run: pnpm exec alchemy deploy --stage prod --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          POSTHOG_REGION: ${{ vars.POSTHOG_REGION }}

      - name: Smoke test
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://jobs.rowlandekemezie.com/) && [ "$status" = "200" ] && exit 0
            echo "Site answered $status on attempt $attempt, retrying in 10 seconds"
            sleep 10
          done
          echo "jobs.rowlandekemezie.com did not answer 200 after deploy"
          exit 1

      - name: Smoke test auth
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w "%{http_code}" https://jobs.rowlandekemezie.com/api/auth/ok) && [ "$status" = "200" ] && exit 0
            echo "/api/auth/ok answered $status on attempt $attempt, retrying in 10 seconds"
            sleep 10
          done
          echo "/api/auth/ok did not answer 200 after deploy"
          exit 1

      - name: Verify public HTML and filter exclusions
        run: |
          for path in / /pricing /about /privacy /terms /contact; do
            curl --connect-timeout 10 --max-time 30 -fsS "https://jobs.rowlandekemezie.com$path" > "$RUNNER_TEMP/public-page.html"
            grep -q 'data-foldkit-app' "$RUNNER_TEMP/public-page.html"
            grep -q 'rel="canonical"' "$RUNNER_TEMP/public-page.html"
          done
          curl --connect-timeout 10 --max-time 30 -fsS -D "$RUNNER_TEMP/filter-headers" -o /dev/null 'https://jobs.rowlandekemezie.com/?age=30'
          grep -iq '^x-robots-tag:.*noindex' "$RUNNER_TEMP/filter-headers"
          grep -iq '^cache-control:.*no-store' "$RUNNER_TEMP/filter-headers"

  preview:
    name: Deploy persistent preview
    needs: check
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://jobs-preview.rowland-ekemezie.workers.dev
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    env:
      ALCHEMY_HOME: /tmp/alchemy-preview-${{ github.run_id }}-${{ github.run_attempt }}
      ALCHEMY_PROFILE: preview
      PREVIEW_PARENT_ONLY: ${{ inputs.preview_parent_only }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build

      - name: Prepare isolated preview profile
        working-directory: apps/infra
        env:
          PREVIEW_BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          PREVIEW_STRIPE_TEST_API_KEY: ${{ secrets.PREVIEW_STRIPE_TEST_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { existsSync, mkdirSync } from 'node:fs';
          const secret = process.env.PREVIEW_BETTER_AUTH_SECRET;
          const key = process.env.PREVIEW_STRIPE_TEST_API_KEY;
          if (!secret || secret.length < 32) throw new Error('PREVIEW_BETTER_AUTH_SECRET must contain at least 32 characters');
          if (!key || !/^(sk|rk)_test_.+$/.test(key)) throw new Error('PREVIEW_STRIPE_TEST_API_KEY must be a Stripe test key');
          if (existsSync(process.env.ALCHEMY_HOME)) throw new Error('Preview profile directory must be fresh');
          mkdirSync(process.env.ALCHEMY_HOME, { mode: 0o700 });
          const env = { ...process.env, CI: 'false' };
          delete env.STRIPE_API_KEY;
          delete env.STRIPE_API_BASE_URL;
          const run = (args, input) => {
            const result = spawnSync('pnpm', ['exec', 'alchemy', ...args, '--no-input'], { env, input, stdio: ['pipe', 'inherit', 'inherit'] });
            if (result.error || result.status !== 0) throw new Error('Preview profile setup failed');
          };
          run(['profile', 'create', 'preview']);
          run(['profile', 'edit', '--profile', 'preview', '--add', 'Stripe', '--method', 'stored', '--set', 'apiKey=-'], key);
          JS

      - name: Require PREVIEW_CLOUDFLARE_API_TOKEN
        env:
          TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Set PREVIEW_CLOUDFLARE_API_TOKEN on the preview environment. docs/operations.md lists the steps."; exit 1; fi

      - name: Check Cloudflare credentials
        working-directory: apps/infra
        run: pnpm exec alchemy provider check-env --provider Cloudflare --no-input
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Plan persistent preview
        working-directory: apps/infra
        env:
          CI: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          PRO_PLANS: ${{ vars.PRO_PLANS }}
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          POSTHOG_REGION: ${{ vars.POSTHOG_REGION }}
        run: |
          unset STRIPE_API_KEY STRIPE_API_BASE_URL
          if [ -z "$PRO_PLANS" ]; then echo "::error::Set the PRO_PLANS variable on the preview environment. apps/api/.env.schema describes PRO_PLANS."; exit 1; fi
          selection=()
          if [ "$PREVIEW_PARENT_ONLY" = true ]; then selection=(--include PullRequestBackend); fi
          pnpm exec alchemy plan --stage preview --profile preview --no-input "${selection[@]}"

      - name: Deploy persistent preview
        if: ${{ !inputs.preview_plan_only }}
        working-directory: apps/infra
        env:
          CI: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          PRO_PLANS: ${{ vars.PRO_PLANS }}
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          POSTHOG_REGION: ${{ vars.POSTHOG_REGION }}
        run: |
          unset STRIPE_API_KEY STRIPE_API_BASE_URL
          selection=()
          if [ "$PREVIEW_PARENT_ONLY" = true ]; then selection=(--include PullRequestBackend --force); fi
          pnpm exec alchemy deploy --stage preview --profile preview --yes --no-input "${selection[@]}"

      - name: Smoke test preview
        if: ${{ !inputs.preview_plan_only }}
        run: |
          for path in / /api/auth/ok; do
            healthy=false
            for attempt in 1 2 3 4 5 6; do
              status=$(curl --connect-timeout 10 --max-time 30 -s -o /dev/null -w "%{http_code}" "https://jobs-preview.rowland-ekemezie.workers.dev$path") || status=000
              if [ "$status" = "200" ]; then healthy=true; break; fi
              echo "Preview $path answered $status on attempt $attempt, retrying in 10 seconds"
              sleep 10
            done
            if [ "$healthy" != true ]; then exit 1; fi
          done
          curl --connect-timeout 10 --max-time 30 -fsS -D "$RUNNER_TEMP/preview-headers" -o /dev/null https://jobs-preview.rowland-ekemezie.workers.dev/
          grep -iq '^x-robots-tag:.*noindex' "$RUNNER_TEMP/preview-headers"
          curl --connect-timeout 10 --max-time 30 -fsS https://jobs-preview.rowland-ekemezie.workers.dev/robots.txt > "$RUNNER_TEMP/preview-robots"
          grep -q '^Disallow: /$' "$RUNNER_TEMP/preview-robots"
          curl --connect-timeout 10 --max-time 30 -fsS https://jobs-preview.rowland-ekemezie.workers.dev/sitemap.xml > "$RUNNER_TEMP/preview-sitemap"
          if grep -q '<url>' "$RUNNER_TEMP/preview-sitemap"; then
            echo "Preview sitemap must not advertise URLs"
            exit 1
          fi

      - name: Remove ephemeral preview credentials
        if: always()
        run: node --input-type=module -e 'import { rmSync } from "node:fs"; rmSync(process.env.ALCHEMY_HOME, { recursive:true, force:true });'

  pr-preview:
    name: Deploy PR preview
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: pr-preview
      url: ${{ steps.preview.outputs.url }}
    concurrency:
      group: deploy-pr-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      ALCHEMY_HOME: /tmp/alchemy-pr-${{ github.run_id }}-${{ github.run_attempt }}
      ALCHEMY_PROFILE: preview
      PR_STAGE: pr-${{ github.event.pull_request.number }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Require PR_PREVIEW_CLOUDFLARE_API_TOKEN
        env:
          TOKEN: ${{ secrets.PR_PREVIEW_CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::Set PR_PREVIEW_CLOUDFLARE_API_TOKEN on the pr-preview environment. docs/operations.md lists the steps."; exit 1; fi

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build

      - name: Prepare PR credentials
        env:
          PREVIEW_BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import { createHmac } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const key = process.env.PREVIEW_BETTER_AUTH_SECRET;
          if (!key || key.length < 32) throw new Error('Missing preview auth secret');
          if (!/^pr-[1-9][0-9]*$/.test(process.env.PR_STAGE)) throw new Error('Invalid PR stage');
          const secret = createHmac('sha256', key).update(`backend-transport:${process.env.PR_STAGE}`).digest('hex');
          console.log(`::add-mask::${secret}`);
          appendFileSync(process.env.GITHUB_ENV, `PR_PREVIEW_SECRET=${secret}\n`);
          JS
          pnpm --filter @rat-stack/infra exec alchemy profile create preview --no-input

      - name: Plan and deploy native previews
        working-directory: apps/infra
        env:
          CI: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.PR_PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          POSTHOG_REGION: ${{ vars.POSTHOG_REGION }}
        run: |
          current=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,headRefOid)
          if [ "$(jq -r .state <<< "$current")" != OPEN ] || [ "$(jq -r .headRefOid <<< "$current")" != "$PR_HEAD_SHA" ]; then
            echo 'PR closed or updated before deploy; refusing a stale deployment'
            exit 1
          fi
          pnpm exec alchemy provider check-env --provider Cloudflare --no-input
          pnpm exec alchemy plan --stage "$PR_STAGE" --profile preview --no-input
          pnpm exec alchemy deploy --stage "$PR_STAGE" --profile preview --yes --no-input
          pnpm exec alchemy state read "JobBoard/$PR_STAGE/output" --backend cloudflare --profile preview --no-input --log-level error > "$RUNNER_TEMP/pr-preview-output.json"

      - name: Verify preview and backend routing
        id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          url=$(jq -er '.websiteUrl' "$RUNNER_TEMP/pr-preview-output.json")
          expected="https://$PR_STAGE-jobs-preview.rowland-ekemezie.workers.dev"
          if [ "$url" != "$expected" ]; then echo 'Unexpected native preview URL'; exit 1; fi
          for path in / /api/auth/ok; do
            curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 -fsS -D "$RUNNER_TEMP/pr-headers" "$url$path" > "$RUNNER_TEMP/pr-body"
            if [ "$path" = / ]; then
              grep -q 'data-foldkit-app' "$RUNNER_TEMP/pr-body"
              grep -iq '^x-robots-tag:.*noindex' "$RUNNER_TEMP/pr-headers"
            else
              grep -iq "^x-jobs-preview-stage: $PR_STAGE" "$RUNNER_TEMP/pr-headers"
            fi
          done
          curl --connect-timeout 10 --max-time 30 -fsS "$url/robots.txt" | grep -q '^Disallow: /$'
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### PR preview: [$PR_STAGE]($url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Update PR comment
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const { HEAD_SHA, PR_STAGE, PREVIEW_URL, RUNNER_TEMP } = process.env;
          writeFileSync(`${RUNNER_TEMP}/preview-comment.json`, JSON.stringify({ body: `<!-- jobs-pr-preview -->\nPreview ready: **[Open PR preview](${PREVIEW_URL})**\n\nCommit: \`${HEAD_SHA.slice(0, 7)}\` · Cloudflare native Worker Previews.\nUses shared preview data. Checkout and scheduled jobs are disabled. This URL updates on pushes and is removed when the PR closes.` }));
          JS
          comment=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- jobs-pr-preview -->"))) | .id' | head -1)
          if [ -n "$comment" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" --input "$RUNNER_TEMP/preview-comment.json" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$RUNNER_TEMP/preview-comment.json" > /dev/null
          fi

      - name: Remove ephemeral PR credentials
        if: always()
        run: node --input-type=module -e 'import { rmSync } from "node:fs"; rmSync(process.env.ALCHEMY_HOME, { recursive:true, force:true });'
